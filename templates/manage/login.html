```html
{% extends "base_manage.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3>Staff / Admin Login</h3>
                </div>

                <div class="card-body">
                    <form method="post" action="{% url 'login' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="id_username" class="form-label">
                                Username
                            </label>
                            <input
                                type="text"
                                name="username"
                                id="id_username"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="id_password" class="form-label">
                                Password
                            </label>
                            <input
                                type="password"
                                name="password"
                                id="id_password"
                                class="form-control"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Login
                        </button>
                    </form>
                    <p>username: admin, staff</p>
                    <p>password: 12345678</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
```
