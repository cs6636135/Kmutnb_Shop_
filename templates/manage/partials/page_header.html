<header class="flex flex-col gap-5 border-b border-[#30415D]/15 pb-8 sm:flex-row sm:items-end sm:justify-between">
    <div>
        <p class="mb-2 text-xs font-bold uppercase tracking-[0.16em] text-[#F47745]">KMUTNB SHOP</p>
        <h1 class="text-3xl font-bold sm:text-4xl">{{ heading }}</h1>
        <p class="mt-2 text-sm text-[#30415D]/70">{{ subtitle_prefix }}{{ subtitle }}</p>
    </div>
    <a href="{% url link_url %}"
       class="inline-flex h-11 items-center justify-center rounded-lg border border-[#30415D]/20 px-5 text-sm font-semibold transition hover:border-[#F47745] hover:text-[#c9572c]">
        {{ link_label }}
    </a>
</header>
