<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}KMUTNB Shop{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#fff8f3]">

<!-- Navbar -->
<nav class="bg-white text-[#4b2424]">
    <div class="max-w-7xl mx-auto px-8">
        <div class="h-24 flex items-center justify-between">

            <!-- Logo -->
            <a href="{% url 'home' %}"
               class="flex flex-col leading-none">

                <span class="text-4xl font-black tracking-tight">
                    KMUTNB
                </span>

                <span class="text-xs tracking-[0.25em] mt-1">
                    SHOP
                </span>

            </a>


            <!-- Menu -->
            <div class="flex items-center gap-2">

                <a href="{% url 'home' %}"
                   class="px-5 py-3
                          text-base
                          hover:underline
                          underline-offset-4
                          transition">

                    หน้าแรก

                </a>


                <a href="{% url 'public_products' %}"
                   class="px-5 py-3
                          text-base
                          hover:underline
                          underline-offset-4
                          transition">

                    สินค้า

                </a>


                {% url 'reservation_status' as reservation_status_url %}
                {% if reservation_status_url %}

                    <a href="{{ reservation_status_url }}"
                       class="px-5 py-3
                              text-base
                              hover:underline
                              underline-offset-4
                              transition">

                        ตรวจสอบการจอง

                    </a>

                {% endif %}

            </div>


            <!-- Right side -->
            <div class="flex items-center gap-5">

                <a href="{% url 'home' %}#product-search"
                   aria-label="ค้นหาสินค้า"
                   title="ค้นหาสินค้า"
                   class="w-10 h-10 flex items-center justify-center rounded-full
                          hover:bg-orange-50 transition">
                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="1.8"
                         stroke="currentColor"
                         class="w-6 h-6"
                         aria-hidden="true">
                        <circle cx="10.8" cy="10.8" r="6.3" />
                        <path stroke-linecap="round" d="m16 16 4 4" />
                    </svg>
                </a>


                <!-- Cart Icon -->
                <div class="w-9 h-9 flex items-center justify-center">

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        class="w-7 h-7">

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25h9.75l3-9H5.106m2.394 9L6.375 17.25h11.25M7.5 14.25 5.106 5.272M9 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm9 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1-1.5 0Z"
                        />

                    </svg>

                </div>

            </div>

        </div>
    </div>
</nav>

    <!-- Django Messages -->
    {% if messages %}
        {% for message in messages %}
            <script>
                alert("{{ message|escapejs }}");
            </script>
        {% endfor %}
    {% endif %}

    <!-- Page Content -->
    {% block content %}
    {% endblock %}

</body>

</html>
